# OpenTelemetry Collector — Production config for OpenObserve
#
# Usage:
#   1. Install: https://opentelemetry.io/docs/collector/install/
#   2. Save as collector-config.yaml
#   3. Run: otelcol --config collector-config.yaml
#
# This collector:
#   - Receives OTLP spans from your app (port 4318)
#   - Batches them efficiently
#   - Retries and queues when OpenObserve is down
#   - Forwards to OpenObserve's OTLP endpoint

receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # Batch spans for efficient export
  batch:
    send_batch_max_size: 512
    send_batch_size: 256
    timeout: 5s

  # Retry on transient failures
  retry_on_failure:
    enabled: true
    initial_interval: 500ms
    max_interval: 30s
    max_elapsed_time: 5m
    multiplier: 2

exporters:
  otlphttp:
    endpoint: "http://localhost:5080/api/default/v1/traces"
    headers:
      Authorization: "Bearer your-api-key-here"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 500ms
      max_interval: 30s
      max_elapsed_time: 5m

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, retry_on_failure]
      exporters: [otlphttp]
